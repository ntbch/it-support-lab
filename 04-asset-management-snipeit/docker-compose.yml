services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_this_root_password}
      MARIADB_DATABASE: ${DB_DATABASE:-snipeit}
      MARIADB_USER: ${DB_USERNAME:-snipeit}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change_this_db_password}
    volumes:
      - snipeit_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  snipe-it:
    image: snipe/snipe-it:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_URL: "http://localhost:8081"
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env (see README)}"
      APP_TIMEZONE: "Asia/Ho_Chi_Minh"
      APP_LOCALE: "en-US"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-snipeit}"
      DB_USERNAME: "${DB_USERNAME:-snipeit}"
      DB_PASSWORD: "${DB_PASSWORD:-change_this_db_password}"
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - snipeit_data:/var/lib/snipeit

volumes:
  snipeit_db:
  snipeit_data:
